
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState Pro - Ultimate UX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root" class="min-h-screen py-8 px-4 flex flex-col items-center max-w-4xl mx-auto">
        <!-- Top Navigation -->
        <header class="w-full flex justify-between items-center mb-12">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i data-lucide="zap" class="w-6 h-6 text-white fill-current"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tighter uppercase italic text-slate-800 dark:text-white">FlowState<span class="text-indigo-500">.</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="p-3 rounded-2xl glass hover:scale-110 active:scale-95 transition-all shadow-sm">
                    <i id="themeIcon" data-lucide="sun" class="w-5 h-5 text-slate-600 dark:text-amber-400"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Welcome Section -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
            <div class="space-y-1">
                <h2 id="greetingText" class="text-4xl font-black tracking-tight text-slate-800 dark:text-white">Focused.</h2>
                <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 font-semibold tracking-wide uppercase text-[10px]">
                    <i data-lucide="calendar" class="w-3 h-3"></i>
                    <span id="currentDate">--</span>
                </div>
            </div>
            
            <!-- Quick Stats -->
            <div class="flex items-center justify-end gap-6 text-right">
                <div>
                    <p id="activeCount" class="text-2xl font-black text-slate-800 dark:text-white">0</p>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active</p>
                </div>
                <div class="w-px h-8 bg-slate-200 dark:bg-slate-800"></div>
                <div>
                    <p id="totalCompleted" class="text-2xl font-black text-emerald-500">0</p>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Done</p>
                </div>
            </div>
        </div>

        <!-- Dashboard Card -->
        <div class="w-full glass rounded-[2.5rem] shadow-2xl overflow-hidden mb-8 border-white/20 relative group">
            <div class="p-8 pb-4">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-3">
                         <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                         <h3 class="text-sm font-black uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500">Current Sprint</h3>
                    </div>
                    <div class="flex flex-col items-end">
                        <span id="progressPercent" class="text-2xl font-black text-indigo-600 dark:text-indigo-400 mono-font">0%</span>
                    </div>
                </div>

                <form id="taskForm" class="relative mb-6">
                    <input
                        id="taskInput"
                        name="name"
                        type="text"
                        autocomplete="off"
                        placeholder="What needs your attention today?"
                        class="w-full bg-slate-100/50 dark:bg-slate-800/40 border border-slate-200/50 dark:border-slate-700/30 rounded-2xl px-6 py-5 pr-16 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 dark:focus:border-indigo-400 text-lg font-semibold placeholder:text-slate-400 transition-all"
                    />
                    <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 p-3.5 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-all active:scale-90">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </form>

                <!-- Filter & Search Toolbar -->
                <div class="flex flex-wrap items-center gap-4 py-4 border-t border-slate-200/50 dark:border-slate-800/50">
                    <div id="filterContainer" class="flex p-1 bg-slate-100/50 dark:bg-slate-900/50 rounded-xl">
                        <button data-filter="all" class="filter-btn px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg transition-all bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-md">All</button>
                        <button data-filter="active" class="filter-btn px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg transition-all text-slate-500">Active</button>
                        <button data-filter="important" class="filter-btn px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg transition-all text-slate-500">Urgent</button>
                    </div>

                    <div class="flex-1 relative min-w-[200px]">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input id="searchInput" type="text" placeholder="Search objectives..." class="w-full pl-11 pr-4 py-2.5 bg-transparent border border-transparent focus:border-indigo-500/30 rounded-xl outline-none text-sm font-semibold transition-all" />
                    </div>

                    <button id="clearBtn" class="hidden text-[10px] font-black uppercase tracking-widest text-red-500 hover:text-red-600 flex items-center gap-2 transition-all">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        Clear Done
                    </button>
                </div>
            </div>

            <!-- Precision Progress Bar -->
            <div class="h-1.5 bg-slate-100 dark:bg-slate-800 w-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 transition-all duration-1000 cubic-bezier(0.19, 1, 0.22, 1)" style="width: 0%"></div>
            </div>
        </div>

        <!-- Active Tag Cloud (Dynamic) -->
        <div id="tagCloud" class="w-full flex flex-wrap gap-2 mb-6 no-scrollbar overflow-x-auto">
            <!-- Tags will be injected here -->
        </div>

        <!-- Main Task List -->
        <div id="taskList" class="w-full space-y-4 pb-32">
            <!-- Tasks injected here -->
        </div>

        

                <!-- Edit Task Modal -->
        <div id="editTaskModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center z-50">
            <div class="edit-task-card bg-[#121229] p-8 rounded-xl w-80 text-white shadow-lg relative">
                <h2 class="text-center mb-6 font-medium">Edit Task</h2>

                <div class="mb-4">
                    <label class="text-sm text-gray-400 block mb-1">Task ID</label>
                    <span id="modalTaskId" class="text-gray-500">--</span>
                </div>

                <div class="mb-4">
                    <label class="text-sm text-gray-400 block mb-1" for="modalTaskName">Name</label>
                    <input id="modalTaskName" type="text" class="w-full p-2 rounded bg-[#1c1c33] text-white" />
                </div>

                <div class="flex items-center mb-6">
                    <input id="modalCompleted" type="checkbox" class="mr-2 w-4 h-4" />
                    <label for="modalCompleted" class="text-gray-400 text-sm">Completed</label>
                </div>

                <button onclick="saveModalTask()" class="w-full py-2 mb-2 bg-indigo-600 rounded hover:bg-indigo-700 transition">Save</button>
                <button onclick="closeModal()" class="w-full py-2 bg-gray-700 rounded hover:bg-gray-800 transition">Cancel</button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <!-- <script src="./script.js"></script> -->
</body>
</html>
