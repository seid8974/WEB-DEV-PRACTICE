
<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<title>Calculator</title>
		<style>
				body{
					margin-left: 300px;
				}
				.calculator{
						width: 200px;
						height: 300px;
						background-color: #635050;
						border: none;
						border-radius: 15px;
				}
				div{
						height: 45px;
						text-align: center;
				}
				input{
						width: 150px;
						margin: 20px;
						padding: 8px;
						background-color: #c2ffc2;
				}
		
				
				button{
						width: 20%;
						height: 90%;
						background-color: #b37676;
						border-radius: 6px;
						font-size: 15px;
						color: white;
						font-weight: bold;
						border: none;
				}
				button:hover{
						background-color: rgba(11, 117, 157, 0.8);
				}
				button:active{
						background-color: rgb(4, 249, 249);
				}
		.calculator-yellow {
		background-color: #ffbd45;
		}
		.calculator-green{
				background-color: #1af81a;
		}
		.calculator-white{
				background-color:white;
				color:black;
		}
		</style>
</head>
<body>

<h1>Calculator</h1>
<div class="calculator">
		
				<input type="text" id="display" readonly="readonly">
		
		<div>
				<button onclick=" appendToDisplay('7')">7</button>
				<button onclick=" appendToDisplay('8')">8</button>
				<button onclick=" appendToDisplay('9')">9</button>
				<button onclick=" appendToDisplay('*')" class="calculator-yellow">*</button>
		</div>
		<div>
				<button onclick=" appendToDisplay('4')">4</button>
				<button onclick=" appendToDisplay('5')">5</button>
				<button onclick=" appendToDisplay('6')">6</button>
				<button onclick=" appendToDisplay('-')" class="calculator-yellow">-</button>
		</div>
		<div>
				<button onclick=" appendToDisplay('1')">1</button>
				<button onclick=" appendToDisplay('2')">2</button>
				<button onclick=" appendToDisplay('3')">3</button>
				<button onclick=" appendToDisplay('+')" class="calculator-yellow">+</button>
		</div>
		<div>
				<button onclick=" calculate()" class="calculator-green">=</button>
				<button onclick=" appendToDisplay('0')">0</button>
				<button onclick=" appendToDisplay('.')">.</button>
				<button onclick=" appendToDisplay('/')" class="calculator-yellow">/</button>
		</div>
		<div>
				<button onclick=" clearAll()" class="calculator-white">c</button>
				<button onclick=" deleteLast()" class="calculator-white">DEL</button>
		</div>
</div>


<script>
		let display = document.getElementById('display');
		
		function appendToDisplay(input){
				display.value += input;
		}
		
		function calculate(){
				try{
						display.value =eval(display.value);
				}catch(e){
						display.value = Error;
				}
		}
		function clearAll(){
				display.value = "";
		}
		function deleteLast(){
				display.value = display.value.slice(0,-1);
		}
</script>

</body>
</html>
