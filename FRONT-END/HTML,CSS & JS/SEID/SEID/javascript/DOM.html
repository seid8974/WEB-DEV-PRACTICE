<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM</title>
  <style>
    .calculator {
      display:inline-block;
    }
    .div1, .div2, .div3 , .div4 , .div5{
    display:inline-block;
      width: 30px;
      height: 10px;
    }
    button {
margin: 0;
      padding: 10px 15px 10px 15px;
    }
  </style>
</head>
<body>
<div class="calculator">
  <div class="div1">
    <button>#</button>
    <button>%</button>
    <button>X</button>
    <button>/</button>
  </div>
  <div class="div2">
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>*</button>
  </div>
  <div class="div3">
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>-</button>
  </div>
  <div class="div4">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>+</button>
</div>
<div class="div5">
    <button>,</button>
    <button>0</button>
    <button>.</button>
    <button>=</button>
</div>
<script>

</script>
</body>
</html>
