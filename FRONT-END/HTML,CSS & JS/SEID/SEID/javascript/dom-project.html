<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dom project</title>
</head>
<body>
<p>YouTube Subscribe Button</p>
<button onclick="
subscribe();
" class="youtube-subscribe-button">subscribe</button>
<script>
function subscribe(){
  const buttonElement=document.querySelector('.youtube-subscribe-button');

  if (buttonElement.innerHTML === 'subscribe'){
    buttonElement.innerHTML='subscribed';
  }else{
    buttonElement.innerHTML='subscribe';
  }
}
</script>
</body>
</html>
