     <!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

	<div id="calculator-container">
		<h3>Calculator</h3>

		<input name="" id="display" readonly>
		<div id="num-oprater">
			<button onclick="appendToDisplay('7')">7</button>
			<button onclick="appendToDisplay('8')">8</button>
			<button  onclick="appendToDisplay('9')">9</button>
			<button  onclick="appendToDisplay('+')" class="oprators">+</button>
			<button  onclick="appendToDisplay('4')">4</button>
			<button  onclick="appendToDisplay('5')">5</button>
			<button  onclick="appendToDisplay('6')">6</button>
			<button  onclick="appendToDisplay('-')" class="oprators">-</button>
			<button  onclick="appendToDisplay('1')">1</button>
			<button  onclick="appendToDisplay('2')">2</button>
			<button  onclick="appendToDisplay('3')">3</button>
			<button  onclick="appendToDisplay('*')" class="oprators">*</button>
			<button  onclick="calculateResult()" class="green-color">=</button>
			<button  onclick="appendToDisplay('0')">0</button>
			<button  onclick="appendToDisplay('.')">.</button>
			<button  onclick="appendToDisplay('/')" class="oprators">/</button>
			<button  onclick="deleteDisplay()" class="white-color">del</button>
			<button  onclick="clearDisplay()" class="white-color">c</button>

		</div>

		
	</div>

<script src="script.js"></script>
</body>
</html>
